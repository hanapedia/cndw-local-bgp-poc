apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-http-echo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-http-echo
  template:
    metadata:
      labels:
        app: go-http-echo
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: go-http-echo
      containers:
        - name: go-http-echo
          image: go-http-echo:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: default-lb
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local # to easily show that ECMP is working
  selector:
    app: go-http-echo
  ports:
    - port: 80
      targetPort: 8080
