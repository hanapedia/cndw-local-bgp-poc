apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-http-echo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: go-http-echo
  template:
    metadata:
      labels:
        app: go-http-echo
    spec:
      containers:
        - name: go-http-echo
          image: go-http-echo:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: default-lb
spec:
  type: LoadBalancer
  selector:
    app: go-http-echo
  ports:
    - port: 80
      targetPort: 8080
