router id 10.0.0.1;

log stderr all;

protocol device {
  scan time 60;
}

protocol kernel {
  merge paths;
  ipv4 {
    export filter {
      if source = RTS_DEVICE then reject;
        accept;
    };
  };
}

template bgp node {
    local as 65000;
    direct;
    # rr client;
    passive;
    error wait time 5,20;

    ipv4 {
        import all;
        export filter {
            if proto = "direct1" then reject;
            accept;
        };
    };
}

protocol bgp 'kind0-control-plane' from node {
    neighbor 10.0.1.2 as 65001;
}

protocol bgp 'kind0-worker' from node {
    neighbor 10.0.2.2 as 65001;
}
