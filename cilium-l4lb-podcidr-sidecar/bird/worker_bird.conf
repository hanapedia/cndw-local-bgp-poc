router id 10.0.2.2;

log stderr all;

protocol device {
  scan time 60;
}

protocol kernel {
  merge paths;
  ipv4 {
    export filter {
        if source = RTS_DEVICE then reject;
        if (65001,65002) ~ bgp_community then reject;
        accept;
    };
  };
}

protocol bgp router0 {
    local as 65001;
    neighbor 10.0.0.1 as 65000;

    multihop;
    error wait time 5,20;
    ipv4 {
        import all;
        export all;
    };
}

protocol bgp cilium {
    local as 65001;
    neighbor 127.0.0.1 as 65002;

    multihop;
    passive;
    ipv4 {
        import filter {
            accept;
        };
        export none;
    };
}
